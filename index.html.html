<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نتایج امتحان | اصول دفتر داری</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap');

*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:"Vazirmatn",Tahoma,sans-serif}
body{
  min-height:100vh; height:100vh; display:flex; align-items:center; justify-content:center;
  padding:0; color:#172033; overflow:hidden;
  background:
    radial-gradient(circle at 15% 15%, rgba(124,58,237,.22), transparent 28%),
    radial-gradient(circle at 85% 10%, rgba(14,165,233,.20), transparent 25%),
    radial-gradient(circle at 50% 100%, rgba(16,185,129,.16), transparent 32%),
    linear-gradient(135deg,#eaf4ff 0%,#f5f3ff 48%,#eafaf6 100%);
}
body:before,body:after{
  content:"";position:fixed;border-radius:50%;filter:blur(2px);pointer-events:none;
}
body:before{width:260px;height:260px;right:-80px;bottom:-70px;background:rgba(56,189,248,.14)}
body:after{width:220px;height:220px;left:-70px;top:-50px;background:rgba(168,85,247,.15)}

.card{
  width:100%; height:100vh; min-height:0; position:relative; overflow:hidden;
  border:1px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.94); backdrop-filter:blur(18px);
  border-radius:30px; box-shadow:0 30px 80px rgba(0,0,0,.32);
}
.top{
  padding:22px 5vw 18px; text-align:center; color:white;
  background:linear-gradient(135deg,#172554,#312e81 55%,#0f766e);
  position:relative; overflow:hidden;
}
.top:after{
  content:"";position:absolute;width:260px;height:260px;border-radius:50%;
  background:rgba(255,255,255,.08);left:-90px;top:-140px;
}
.badge{
  display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;
  background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.18);
  font-size:13px;font-weight:600;position:relative;z-index:1;
}
h1{margin:16px 0 7px;font-size:28px;position:relative;z-index:1}
.subtitle{margin:0;color:rgba(255,255,255,.78);font-size:14px;position:relative;z-index:1}

.search{padding:32px 5vw 20px}
label{display:block;font-size:14px;font-weight:700;margin-bottom:10px}
.input-wrap{position:relative}
input{
  width:100%; height:58px; border:2px solid #e5e7eb; border-radius:17px;
  padding:0 18px; font-family:"Vazirmatn",Tahoma,sans-serif;font-size:17px;outline:none;transition:.2s;
  background:#fff;color:#111827; direction:ltr;text-align:center;letter-spacing:1px;
}
input:focus{border-color:#6366f1;box-shadow:0 0 0 4px rgba(99,102,241,.11)}
button{
  width:100%;height:56px;margin-top:13px;border:0;border-radius:17px;
  color:white;font-family:"Vazirmatn",Tahoma,sans-serif;font-weight:700;font-size:16px;cursor:pointer;
  background:linear-gradient(135deg,#4f46e5,#7c3aed);
  box-shadow:0 10px 25px rgba(79,70,229,.25);transition:.2s;
}
button:hover{transform:translateY(-1px);box-shadow:0 14px 28px rgba(79,70,229,.3)}
.hint{text-align:center;color:#64748b;font-size:12px;margin:12px 0 0}

.result{padding:0 5vw 20px;display:none}
.result.show{display:block;animation:up .35s ease}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.profile{
  width:100%; height:calc(100vh - 210px); min-height:0;
  border:1px solid rgba(226,232,240,.9);border-radius:26px;padding:22px;box-shadow:0 20px 55px rgba(59,130,246,.10), 0 8px 25px rgba(15,23,42,.06);
  position:relative; overflow:hidden;
  background:
    radial-gradient(circle at 85% 15%, rgba(99,102,241,.13), transparent 28%),
    radial-gradient(circle at 10% 85%, rgba(16,185,129,.12), transparent 30%),
    radial-gradient(circle at 50% 45%, rgba(14,165,233,.07), transparent 38%),
    linear-gradient(135deg,#ffffff 0%,#f8fbff 48%,#f0fdf9 100%);
  display:grid;grid-template-columns:minmax(0,2fr) minmax(300px,1fr);
  gap:28px;align-items:stretch;
}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-content:center}
.item{padding:10px 12px;border-radius:14px;background:linear-gradient(135deg,#f8fafc,#eef6ff)}
.item small{display:block;color:#64748b;font-size:11px;margin-bottom:4px}
.item strong{font-size:14px}

.scorebox{
  margin-top:0;border-radius:26px;padding:30px;text-align:center;
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  border:1px solid #dbeafe;background:linear-gradient(145deg,#eff6ff,#f8fafc);
}
.profile:before{
  content:""; position:absolute; left:8%; right:8%; top:0; height:3px;
  border-radius:0 0 20px 20px;
  background:linear-gradient(90deg,#60a5fa,#818cf8,#34d399);
  opacity:.75;
}
.profile > .grid{grid-column:1}
.profile > .scorebox{grid-column:2;grid-row:1}
.score-label{font-size:13px;color:#64748b;margin-bottom:5px}
.score{font-size:68px;line-height:1;font-weight:800;letter-spacing:-2px}
.outof{font-size:14px;color:#64748b;margin-top:6px}
.status{
  display:inline-flex;align-items:center;gap:8px;margin-top:14px;
  padding:9px 16px;border-radius:999px;font-size:14px;font-weight:800;
}
.pass .score{color:#059669}.pass .status{color:#047857;background:#d1fae5}
.pass .scorebox{border-color:#a7f3d0;background:linear-gradient(145deg,#ecfdf5,#f8fafc)}
.fail .score{color:#dc2626}.fail .status{color:#b91c1c;background:#fee2e2}
.warn .score{color:#dc2626}
.warn .status{color:#b91c1c;background:#fee2e2}
.warn .scorebox{border-color:#fecaca;background:linear-gradient(145deg,#fff1f2,#fff)}

.fail .scorebox{border-color:#fecaca;background:linear-gradient(145deg,#fff1f2,#fff)}
.fail .status{border:1px solid #fca5a5}
.fail .score{color:#dc2626}
.notice{
  margin-top:14px;text-align:center;font-size:12px;color:#64748b;
}
.new-search{
  width:auto;min-width:190px;height:44px;display:block;margin:10px 0 14px auto;
  padding:0 20px;border:1px solid #cbd5e1;border-radius:13px;
  color:#475569;background:#f8fafc;box-shadow:none;font-size:13px;
}
.new-search:hover{transform:none;box-shadow:0 6px 15px rgba(15,23,42,.08)}
.top-search{margin:0 0 14px auto}
.bottom-search{margin:16px auto 0}
.error{
  display:none;margin:0 34px 20px;padding:13px 16px;border-radius:14px;
  background:#fff1f2;color:#be123c;border:1px solid #fecdd3;text-align:center;font-size:13px;font-weight:600;
}
.footer{text-align:center;color:#94a3b8;font-size:11px;padding:0 5vw 22px}
@media(max-width:700px){
  body{height:auto;min-height:100vh;overflow:auto}
  .card{height:auto;min-height:100vh}
  .top,.search{padding-left:20px;padding-right:20px}
  .result{padding-left:20px;padding-right:20px}
  .footer{padding-left:20px;padding-right:20px}
  .error{margin-left:20px;margin-right:20px}
  .grid{grid-template-columns:repeat(2,1fr)}
  .profile{display:block;height:auto;min-height:auto;padding:20px}
  .profile > .scorebox{margin-top:18px}
  h1{font-size:23px}.score{font-size:56px}
}
@media(max-width:430px){
  .grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="card">
  <section class="top">
    <div class="badge">✦ سامانه مشاهده نتایج</div>
    <h1>نتایج امتحان اصول دفتر داری</h1>
    <p class="subtitle">برای مشاهده نتیجه، شماره محصل (ID) خود را وارد کنید</p>
  </section>

  <section class="search">
    <label for="studentId">شماره محصل (ID)</label>
    <div class="input-wrap">
      <input id="studentId" inputmode="numeric" autocomplete="off" placeholder="آی دی خود را وارد نمائید" maxlength="10">
    </div>
    <button id="searchBtn">مشاهده نتیجه</button>
    <p class="hint">نتیجه فقط برای ID واردشده نمایش داده می‌شود.</p>
  </section>

  <div id="error" class="error">شماره محصل پیدا نشد. لطفاً ID را دقیق وارد کنید.</div>

  <section id="result" class="result">
    <button id="newSearchTop" class="new-search top-search" type="button">⌕ جستجوی ID دیگر</button>
    <div id="profile" class="profile"></div>
    <div id="notice" class="notice">حد نصاب موفقیت: نمره ۱۰ از ۲۰ و بالاتر</div>
    <button id="newSearch" class="new-search bottom-search" type="button">جستجوی نتیجه دیگر</button>
  </section>

  <div class="footer">سامانه نتایج • اصول دفتر داری • دیپارتمنت بیولوژی</div>
</div>

<script>
const students = [{"ID": 71001, "اسم": "سید امیر", "تخلص": "امیری", "ولد": "سید عالم", "سمستر": "هفتم", "مضمون": "اصول دفتر داری", "دیپارتمنت": "بیولوژی", "نوعیت امتحان": "بیست فیصد", "نمره": 7.0}, {"ID": 71002, "اسم": "عبدالحی", "تخلص": "رنجی", "ولد": "عبدالباقی", "سمستر": "هفتم", "مضمون": "اصول دفتر داری", "دیپارتمنت": "بیولوژی", "نوعیت امتحان": "بیست فیصد", "نمره": 14.5}, {"ID": 71003, "اسم": "عبدالرحمن", "تخلص": "احمد یار", "ولد": "عبدالغفور", "سمستر": "هفتم", "مضمون": "اصول دفتر داری", "دیپارتمنت": "بیولوژی", "نوعیت امتحان": "بیست فیصد", "نمره": 12.0}, {"ID": 71004, "اسم": "نورالله", "تخلص": "غفوری", "ولد": "عبدالغفور", "سمستر": "هفتم", "مضمون": "اصول دفتر داری", "دیپارتمنت": "بیولوژی", "نوعیت امتحان": "بیست فیصد", "نمره": 12.0}, {"ID": 71005, "اسم": "دادالله", "تخلص": "دادفر", "ولد": "ابوبکر", "سمستر": "هفتم", "مضمون": "اصول دفتر داری", "دیپارتمنت": "بیولوژی", "نوعیت امتحان": "بیست فیصد", "نمره": 0.0}, {"ID": 71006, "اسم": "زبیر", "تخلص": "کریمی", "ولد": "نظام الدین", "سمستر": "هفتم", "مضمون": "اصول دفتر داری", "دیپارتمنت": "بیولوژی", "نوعیت امتحان": "بیست فیصد", "نمره": 10.0}, {"ID": 71007, "اسم": "شراف الدین", "تخلص": "رستمی", "ولد": "رستم", "سمستر": "هفتم", "مضمون": "اصول دفتر داری", "دیپارتمنت": "بیولوژی", "نوعیت امتحان": "بیست فیصد", "نمره": 12.5}, {"ID": 71008, "اسم": "صبغت الله", "تخلص": "محمدی", "ولد": "گل محمد", "سمستر": "هفتم", "مضمون": "اصول دفتر داری", "دیپارتمنت": "بیولوژی", "نوعیت امتحان": "بیست فیصد", "نمره": 11.8}, {"ID": 71009, "اسم": "ظاهر", "تخلص": "خادم", "ولد": "محمد یحی", "سمستر": "هفتم", "مضمون": "اصول دفتر داری", "دیپارتمنت": "بیولوژی", "نوعیت امتحان": "بیست فیصد", "نمره": 0.0}, {"ID": 71010, "اسم": "عبدالقادر", "تخلص": "احمدی", "ولد": "عبدالحمید", "سمستر": "هفتم", "مضمون": "اصول دفتر داری", "دیپارتمنت": "بیولوژی", "نوعیت امتحان": "بیست فیصد", "نمره": 9.0}, {"ID": 71011, "اسم": "غلام جیلانی", "تخلص": "رحمانی", "ولد": "غلام غوث", "سمستر": "هفتم", "مضمون": "اصول دفتر داری", "دیپارتمنت": "بیولوژی", "نوعیت امتحان": "بیست فیصد", "نمره": 3.5}, {"ID": 71012, "اسم": "غلام رضا", "تخلص": "سعادت", "ولد": "غلام نبی", "سمستر": "هفتم", "مضمون": "اصول دفتر داری", "دیپارتمنت": "بیولوژی", "نوعیت امتحان": "بیست فیصد", "نمره": 14.7}, {"ID": 71013, "اسم": "محمد عارف", "تخلص": "عرفان", "ولد": "خداداد", "سمستر": "هفتم", "مضمون": "اصول دفتر داری", "دیپارتمنت": "بیولوژی", "نوعیت امتحان": "بیست فیصد", "نمره": 8.3}, {"ID": 71014, "اسم": "محمد عارف", "تخلص": "آزاد", "ولد": "محمد اکبر", "سمستر": "هفتم", "مضمون": "اصول دفتر داری", "دیپارتمنت": "بیولوژی", "نوعیت امتحان": "بیست فیصد", "نمره": 15.0}, {"ID": 71015, "اسم": "محمد عمر", "تخلص": "اقبالی", "ولد": "احسام الدین", "سمستر": "هفتم", "مضمون": "اصول دفتر داری", "دیپارتمنت": "بیولوژی", "نوعیت امتحان": "بیست فیصد", "نمره": 18.0}, {"ID": 71016, "اسم": "مسعود", "تخلص": "رسولی", "ولد": "مقصود", "سمستر": "هفتم", "مضمون": "اصول دفتر داری", "دیپارتمنت": "بیولوژی", "نوعیت امتحان": "بیست فیصد", "نمره": 9.5}, {"ID": 71017, "اسم": "مسلم", "تخلص": "احمدی", "ولد": "ذاکر", "سمستر": "هفتم", "مضمون": "اصول دفتر داری", "دیپارتمنت": "بیولوژی", "نوعیت امتحان": "بیست فیصد", "نمره": 10.5}, {"ID": 71018, "اسم": "عبدالقدیر", "تخلص": "تابش", "ولد": "عبدالله", "سمستر": "هفتم", "مضمون": "اصول دفتر داری", "دیپارتمنت": "بیولوژی", "نوعیت امتحان": "بیست فیصد", "نمره": 8.0}, {"ID": 71019, "اسم": "محمود ", "تخلص": "نوری", "ولد": "نجم الدین", "سمستر": "هفتم", "مضمون": "اصول دفتر داری", "دیپارتمنت": "بیولوژی", "نوعیت امتحان": "بیست فیصد", "نمره": 8.0}];

const input = document.getElementById('studentId');
const btn = document.getElementById('searchBtn');
const result = document.getElementById('result');
const profile = document.getElementById('profile');
const error = document.getElementById('error');

function normalizeId(value){
  return String(value || '').replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).trim();
}
function fmtScore(n){
  const x = Number(n);
  return Number.isInteger(x) ? String(x) : x.toFixed(1).replace(/\.0$/,'');
}
function search(){
  const id = normalizeId(input.value);
  const s = students.find(x => String(x.ID).trim() === id);
  error.style.display = 'none';
  result.classList.remove('show');

  if(!s){
    error.style.display = 'block';
    return;
  }

  const score = Number(s['نمره']);
  let cls, icon, status;

  if(score === 0){
    cls = 'fail';
    icon = '⚠';
    status = 'ناکام';
  } else if(score < 10){
    cls = 'warn';
    icon = '⚠';
    status = 'نیاز به تلاش بیشتر';
  } else {
    cls = 'pass';
    icon = '✓';
    status = 'موفق';
  }

  profile.className = 'profile ' + cls;
  profile.innerHTML = `
    <div class="grid">
      <div class="item"><small>اسم</small><strong>${s['اسم']}</strong></div>
      <div class="item"><small>تخلص</small><strong>${s['تخلص']}</strong></div>
      <div class="item"><small>ولد</small><strong>${s['ولد']}</strong></div>
      <div class="item"><small>شماره محصل (ID)</small><strong>${s['ID']}</strong></div>
      <div class="item"><small>سمستر</small><strong>${s['سمستر']}</strong></div>
      <div class="item"><small>دیپارتمنت</small><strong>${s['دیپارتمنت']}</strong></div>
      <div class="item"><small>مضمون</small><strong>${s['مضمون']}</strong></div>
      <div class="item"><small>نوعیت امتحان</small><strong>${s['نوعیت امتحان']}</strong></div>
    </div>
    <div class="scorebox">
      <div class="score-label">نمره شما</div>
      <div class="score">${fmtScore(score)}</div>
      <div class="outof">از ۲۰</div>
      <div class="status">${icon} ${status}</div>
    </div>
  `;
  result.classList.add('show');
  document.querySelector('.search').style.display = 'none';
  window.scrollTo(0, 0);
}

btn.addEventListener('click', search);
input.addEventListener('keydown', e => { if(e.key === 'Enter') search(); });

function resetSearch(){
  result.classList.remove('show');
  document.querySelector('.search').style.display = 'block';
  input.value = '';
  error.style.display = 'none';
  input.focus();
  window.scrollTo({top:0, behavior:'smooth'});
}
document.getElementById('newSearch').addEventListener('click', resetSearch);
document.getElementById('newSearchTop').addEventListener('click', resetSearch);

});*/
</script>
</body>
</html>
